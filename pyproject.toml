[project]
name = "pattern-lens"
version = "0.1.0"
description = "Проверка транскрибаций «бодрого утра» на соответствие методологии супервизии с помощью GigaChat"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "langchain-gigachat>=0.5.1",
    "langchain-core>=0.3.0",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.52.2",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
