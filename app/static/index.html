<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pattern Lens</title>
<style>
  :root {
    --bg-top: #0d3b3f;
    --bg-mid: #10333f;
    --bg-bottom: #0a2733;
    --panel: rgba(255, 255, 255, 0.06);
    --panel-hover: rgba(255, 255, 255, 0.10);
    --panel-border: rgba(255, 255, 255, 0.11);
    --ink: #eef4f4;
    --ink-dim: rgba(238, 244, 244, 0.55);
    --ink-faint: rgba(238, 244, 244, 0.32);
    --accent: #2ecfa2;
    --accent-strong: #24b48d;
    --danger: #ff6e6e;
    --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--font);
    color: var(--ink);
    background:
      radial-gradient(1100px 540px at 50% -8%, #14545a 0%, transparent 62%),
      linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 45%, var(--bg-bottom) 100%);
    background-attachment: fixed;
    min-height: 100%;
    -webkit-font-smoothing: antialiased;
  }

  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 360px;
    gap: 22px;
    max-width: 1320px;
    margin: 0 auto;
    padding: 32px 24px 60px;
  }
  @media (max-width: 960px) {
    .layout { grid-template-columns: 1fr; }
  }

  header.top {
    grid-column: 1 / -1;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 6px;
    gap: 16px;
    flex-wrap: wrap;
  }
  .brand-mark { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
  .brand-mark .lens { color: var(--accent); }
  .brand-sub { margin-top: 6px; font-size: 13.5px; color: var(--ink-dim); }

  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 18px;
    padding: 22px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }
  .panel h2 {
    font-size: 12.5px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    font-weight: 600;
    color: var(--ink-dim);
    margin: 0 0 14px;
  }

  textarea#transcript {
    width: 100%;
    min-height: 260px;
    resize: vertical;
    background: rgba(0, 0, 0, 0.18);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    color: var(--ink);
    font-family: var(--font);
    font-size: 14.5px;
    line-height: 1.65;
    padding: 16px;
    transition: border-color .15s ease;
  }
  textarea#transcript:focus { outline: none; border-color: rgba(46, 207, 162, .5); }
  textarea#transcript::placeholder { color: var(--ink-faint); }

  .llm-picker { display: flex; gap: 16px; margin-top: 14px; flex-wrap: wrap; }
  .field-inline { display: flex; align-items: center; gap: 8px; }
  .field-inline label { font-size: 12.5px; color: var(--ink-faint); white-space: nowrap; }
  .field-inline select {
    background: rgba(0, 0, 0, 0.2);
    border: 1px solid var(--panel-border);
    border-radius: 9px;
    color: var(--ink);
    font-family: var(--font);
    font-size: 13px;
    padding: 8px 12px;
    cursor: pointer;
  }
  .field-inline select:focus { outline: none; border-color: var(--accent); }

  .actions { display: flex; gap: 10px; margin-top: 16px; align-items: center; flex-wrap: wrap; }
  button {
    font-family: var(--font);
    cursor: pointer;
    border: none;
    border-radius: 999px;
    padding: 11px 20px;
    font-size: 14px;
    font-weight: 600;
    transition: opacity .15s ease, background .15s ease, transform .12s ease;
  }
  button.primary { background: var(--accent); color: #06231a; }
  button.primary:hover:not(:disabled) { background: var(--accent-strong); }
  button.primary:disabled { opacity: 0.45; cursor: default; }
  button.ghost {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--ink-dim);
  }
  button.ghost:hover { background: var(--panel-hover); color: var(--ink); }
  button.ghost:disabled { opacity: 0.4; cursor: default; }
  button:active:not(:disabled) { transform: scale(.97); }

  .status-line { font-size: 13px; color: var(--ink-faint); display: flex; align-items: center; gap: 8px; }
  .status-line.error { color: var(--danger); }
  .spinner {
    width: 13px; height: 13px;
    border: 2px solid rgba(255,255,255,.2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
    flex: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* --- Результат --- */
  #result-wrap { display: none; margin-top: 20px; flex-direction: column; gap: 16px; }
  #result-wrap.visible { display: flex; }

  #summary-box {
    background: rgba(46, 207, 162, 0.08);
    border: 1px solid rgba(46, 207, 162, 0.25);
    border-radius: 14px;
    padding: 16px 18px;
    font-size: 14px;
    line-height: 1.6;
    color: var(--ink);
  }
  #summary-box .summary-label {
    display: block;
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 8px;
  }

  #legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .legend-chip {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: rgba(0,0,0,0.18);
    border: 1px solid var(--panel-border);
    border-radius: 999px;
    padding: 6px 12px 6px 8px;
    font-size: 12.5px;
    color: var(--ink-dim);
  }
  .legend-swatch { width: 11px; height: 11px; border-radius: 3px; flex: none; }
  .legend-count {
    background: rgba(255,255,255,0.08);
    border-radius: 999px;
    padding: 1px 7px;
    font-size: 11px;
    font-weight: 700;
  }

  #result-box {
    background: rgba(0, 0, 0, 0.18);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 22px 24px;
    font-size: 14.5px;
    line-height: 1.75;
    white-space: pre-wrap;
    max-height: 640px;
    overflow-y: auto;
  }
  mark.pattern-hit {
    padding: 1.5px 3px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: 600;
    color: #10161a;
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
  }
  mark.pattern-hit:hover { filter: brightness(1.1); }

  .result-actions { display: flex; gap: 10px; flex-wrap: wrap; }

  /* --- Тултип --- */
  #hit-popover {
    position: fixed; z-index: 60; max-width: 320px;
    background: var(--bg-mid); border: 1px solid var(--panel-border);
    border-radius: 12px; padding: 13px 15px; font-size: 13px; line-height: 1.5;
    box-shadow: 0 16px 40px rgba(0,0,0,0.5);
    display: none;
  }
  #hit-popover.visible { display: block; }
  #hit-popover .hp-title { font-weight: 700; margin-bottom: 6px; }
  #hit-popover .hp-quote { color: var(--ink-dim); font-style: italic; margin-bottom: 6px; }

  .empty-note { color: var(--ink-faint); font-size: 13px; padding: 8px 0; }

  /* --- Этапы --- */
  .stage-list { display: flex; flex-direction: column; gap: 10px; }
  .stage-card {
    border: 1px solid var(--panel-border);
    border-left: 3px solid transparent;
    border-radius: 12px;
    background: rgba(0, 0, 0, 0.16);
    overflow: hidden;
  }
  .stage-card.pass { border-left-color: var(--accent); }
  .stage-card.fail { border-left-color: var(--danger); }
  .stage-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; padding: 12px 14px; cursor: pointer;
    flex-wrap: wrap;
  }
  .stage-head .title { font-size: 13.5px; font-weight: 600; min-width: 0; flex: 1 1 160px; white-space: normal; word-break: break-word; }
  .stage-badge {
    font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px;
    white-space: nowrap; flex: none;
  }
  .stage-badge.pass { background: rgba(46, 207, 162, 0.18); color: var(--accent); }
  .stage-badge.fail { background: rgba(255, 110, 110, 0.15); color: var(--danger); }
  .stage-badge.pending { background: rgba(255,255,255,0.08); color: var(--ink-faint); }
  .stage-body { display: none; padding: 0 14px 14px; flex-direction: column; gap: 8px; }
  .stage-body.open { display: flex; }
  .criterion-row { display: flex; gap: 9px; align-items: flex-start; font-size: 12.5px; line-height: 1.5; }
  .criterion-mark { flex: none; width: 16px; height: 16px; border-radius: 50%; margin-top: 1px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; }
  .criterion-mark.yes { background: rgba(46, 207, 162, 0.2); color: var(--accent); }
  .criterion-mark.no { background: rgba(255, 110, 110, 0.15); color: var(--danger); }
  .criterion-text { color: var(--ink); }
  .criterion-explain { color: var(--ink-faint); margin-top: 2px; }
  .criterion-quote { color: var(--ink-dim); font-style: italic; margin-top: 2px; }

  /* --- Toast --- */
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--bg-mid); border: 1px solid var(--panel-border);
    color: var(--ink); padding: 12px 20px; border-radius: 999px;
    font-size: 13.5px; opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease;
    z-index: 200; box-shadow: 0 20px 50px rgba(0,0,0,.4);
  }
  #toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <div class="layout">
    <header class="top">
      <div>
        <div class="brand-mark">Pattern <span class="lens">Lens</span></div>
        <div class="brand-sub">Проверка транскрибаций «бодрого утра» на соответствие методологии супервизии</div>
      </div>
    </header>

    <section class="panel">
      <h2>Транскрибация</h2>
      <textarea id="transcript" placeholder="Вставьте текст транскрибации встречи..."></textarea>
      <div class="llm-picker">
        <div class="field-inline">
          <label>Провайдер</label>
          <select id="provider-select"></select>
        </div>
        <div class="field-inline">
          <label>Модель</label>
          <select id="model-select"></select>
        </div>
      </div>
      <div class="actions">
        <button class="primary" id="analyze-btn">Проверить этапы</button>
        <button class="ghost" id="clear-btn">Очистить</button>
        <span class="status-line" id="status-line"></span>
      </div>

      <div id="result-wrap">
        <div id="summary-box">
          <span class="summary-label">Итоговое заключение</span>
          <div id="summary-text"></div>
        </div>
        <div id="legend"></div>
        <div id="result-box"></div>
        <div class="result-actions">
          <button class="ghost" id="export-doc-btn">⭳ Экспорт в .doc</button>
        </div>
      </div>
    </section>

    <section class="panel">
      <h2>Этапы супервизии</h2>
      <div class="stage-list" id="stage-list"></div>
    </section>
  </div>

  <div id="hit-popover"></div>
  <div id="toast"></div>

<script>
// Приглушённая палитра для этапов методологии — цвет по индексу этапа, стабилен между запусками.
const STAGE_PALETTE = [
  '#5fb8ff', '#ffb15f', '#8fe0a0', '#e07eff', '#ff8f9d', '#7ecbe0',
];

const state = { stages: [], stageResults: [], highlights: [], summary: '', providers: {}, transcript: '', openStages: new Set() };

const stageListEl = document.getElementById('stage-list');
const transcriptEl = document.getElementById('transcript');
const resultWrapEl = document.getElementById('result-wrap');
const resultBoxEl = document.getElementById('result-box');
const summaryTextEl = document.getElementById('summary-text');
const legendEl = document.getElementById('legend');
const statusLineEl = document.getElementById('status-line');
const providerSelectEl = document.getElementById('provider-select');
const modelSelectEl = document.getElementById('model-select');
const analyzeBtn = document.getElementById('analyze-btn');
const exportBtn = document.getElementById('export-doc-btn');
const hitPopover = document.getElementById('hit-popover');
const toastEl = document.getElementById('toast');

function escapeHtml(str) {
  return str.replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('visible');
  setTimeout(() => toastEl.classList.remove('visible'), 2600);
}

async function loadLlmProviders() {
  const res = await fetch('/api/v1/llm-providers');
  state.providers = await res.json();

  providerSelectEl.innerHTML = Object.keys(state.providers)
    .map(p => `<option value="${p}">${p === 'gigachat' ? 'GigaChat' : 'OpenRouter'}</option>`)
    .join('');

  renderModelOptions();
}

function renderModelOptions() {
  const provider = providerSelectEl.value;
  const models = state.providers[provider] || [];
  modelSelectEl.innerHTML = models.map(m => `<option value="${m}">${m}</option>`).join('');
}

providerSelectEl.addEventListener('change', renderModelOptions);

async function loadStages() {
  const res = await fetch('/api/v1/stages');
  state.stages = await res.json();
  renderStages();
}

function renderStages() {
  const results = state.stageResults;
  const byId = {};
  (results || []).forEach(r => { byId[r.stage_id] = r; });

  if (state.stages.length === 0) {
    stageListEl.innerHTML = '<div class="empty-note">Загрузка этапов...</div>';
    return;
  }

  stageListEl.innerHTML = state.stages.map(stage => {
    const result = byId[stage.id];
    const open = state.openStages.has(stage.id);
    let badgeClass = 'pending';
    let badgeText = `${stage.criteria.length} критериев`;
    let cardClass = '';
    if (result) {
      badgeClass = result.passed ? 'pass' : 'fail';
      badgeText = result.passed ? 'Выполнен' : 'Не выполнен';
      cardClass = result.passed ? 'pass' : 'fail';
    }

    const criteriaById = {};
    (result ? result.criteria : []).forEach(c => { criteriaById[c.criterion_id] = c; });

    const criteriaHtml = stage.criteria.map(c => {
      const v = criteriaById[c.id];
      if (!v) {
        return `<div class="criterion-row"><span class="criterion-mark" style="background:rgba(255,255,255,.08)">–</span><div class="criterion-text">${escapeHtml(c.text)}</div></div>`;
      }
      const markClass = v.verdict ? 'yes' : 'no';
      const markGlyph = v.verdict ? '✓' : '✕';
      return `
        <div class="criterion-row">
          <span class="criterion-mark ${markClass}">${markGlyph}</span>
          <div>
            <div class="criterion-text">${escapeHtml(c.text)}</div>
            ${v.explanation ? `<div class="criterion-explain">${escapeHtml(v.explanation)}</div>` : ''}
            ${v.quote ? `<div class="criterion-quote">«${escapeHtml(v.quote)}»</div>` : ''}
          </div>
        </div>`;
    }).join('');

    return `
      <div class="stage-card ${cardClass}" data-stage-id="${stage.id}">
        <div class="stage-head" data-action="toggle-stage" data-stage-id="${stage.id}">
          <span class="title">${escapeHtml(stage.title)}</span>
          <span class="stage-badge ${badgeClass}">${escapeHtml(badgeText)}</span>
        </div>
        <div class="stage-body ${open ? 'open' : ''}">${criteriaHtml}</div>
      </div>`;
  }).join('');
}

stageListEl.addEventListener('click', (e) => {
  const head = e.target.closest('[data-action="toggle-stage"]');
  if (!head) return;
  const id = head.dataset.stageId;
  if (state.openStages.has(id)) {
    state.openStages.delete(id);
  } else {
    state.openStages.add(id);
  }
  renderStages();
});

// --- Анализ транскрибации ---
const LAST_RUN_KEY = 'pattern-lens:last-run';

function saveLastRun() {
  try {
    localStorage.setItem(LAST_RUN_KEY, JSON.stringify({
      transcript: state.transcript,
      stageResults: state.stageResults,
      summary: state.summary,
      provider: providerSelectEl.value,
      model: modelSelectEl.value,
    }));
  } catch (e) { /* localStorage может быть недоступен (приватный режим) — просто не сохраняем */ }
}

function clearLastRun() {
  try { localStorage.removeItem(LAST_RUN_KEY); } catch (e) { /* см. выше */ }
}

function restoreLastRun() {
  let saved;
  try {
    saved = JSON.parse(localStorage.getItem(LAST_RUN_KEY) || 'null');
  } catch (e) {
    saved = null;
  }
  if (!saved || !saved.transcript) return;

  transcriptEl.value = saved.transcript;
  state.transcript = saved.transcript;
  state.stageResults = saved.stageResults || [];
  state.summary = saved.summary || '';
  renderStages();
  renderResult();
  const passedCount = state.stageResults.filter(s => s.passed).length;
  statusLineEl.textContent = `Восстановлен последний прогон. Выполнено этапов: ${passedCount} из ${state.stageResults.length}.`;
}

document.getElementById('clear-btn').addEventListener('click', () => {
  transcriptEl.value = '';
  resultWrapEl.classList.remove('visible');
  resultBoxEl.innerHTML = '';
  legendEl.innerHTML = '';
  summaryTextEl.textContent = '';
  statusLineEl.textContent = '';
  state.stageResults = [];
  state.highlights = [];
  state.transcript = '';
  clearLastRun();
  renderStages();
});

analyzeBtn.addEventListener('click', async () => {
  const transcript = transcriptEl.value.trim();
  if (!transcript) {
    statusLineEl.textContent = 'Вставьте текст транскрибации.';
    statusLineEl.classList.add('error');
    return;
  }
  const providerLabel = providerSelectEl.value === 'openrouter' ? 'OpenRouter' : 'GigaChat';
  statusLineEl.classList.remove('error');
  analyzeBtn.disabled = true;

  // Таймер прогресса — на длинных транскрибациях ответ может идти 1.5-2 минуты, и без
  // видимого счётчика это выглядит как зависание (уже было ложное сообщение об этом).
  const startedAt = Date.now();
  const tick = () => {
    const sec = Math.floor((Date.now() - startedAt) / 1000);
    statusLineEl.innerHTML = `<span class="spinner"></span> Анализирую с помощью ${escapeHtml(providerLabel)} (${escapeHtml(modelSelectEl.value)})... ${sec}с`;
  };
  tick();
  const timerId = setInterval(tick, 1000);

  try {
    const res = await fetch('/api/v1/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        transcript,
        provider: providerSelectEl.value,
        model: modelSelectEl.value,
      }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || `Ошибка ${res.status}`);
    }
    const data = await res.json();
    state.stageResults = data.stages || [];
    state.summary = data.summary || '';
    state.transcript = transcript;
    renderStages();
    renderResult();
    saveLastRun();
    const passedCount = state.stageResults.filter(s => s.passed).length;
    statusLineEl.textContent = `Готово. Выполнено этапов: ${passedCount} из ${state.stageResults.length}.`;
  } catch (e) {
    statusLineEl.textContent = e.message || 'Не удалось выполнить анализ.';
    statusLineEl.classList.add('error');
  } finally {
    clearInterval(timerId);
    analyzeBtn.disabled = false;
  }
});

// Подсветки в тексте — по одной на каждый выполненный критерий с найденной цитатой, цвет по этапу.
function buildHighlights() {
  const highlights = [];
  state.stageResults.forEach((stage, stageIdx) => {
    stage.criteria.forEach(c => {
      if (c.verdict && c.quote && c.start != null && c.end != null) {
        highlights.push({
          start: c.start,
          end: c.end,
          color: STAGE_PALETTE[stageIdx % STAGE_PALETTE.length],
          title: stage.stage_title,
          quote: c.quote,
          explanation: c.explanation,
        });
      }
    });
  });
  highlights.sort((a, b) => a.start - b.start);
  return highlights;
}

function renderResult() {
  resultWrapEl.classList.add('visible');
  summaryTextEl.textContent = state.summary || '—';
  state.highlights = buildHighlights();
  renderLegend();
  renderHighlighted(state.transcript, state.highlights);
}

function renderLegend() {
  if (state.highlights.length === 0) {
    legendEl.innerHTML = '<div class="empty-note">Совпадений не найдено.</div>';
    return;
  }
  const counts = {};
  const meta = {};
  state.highlights.forEach(h => {
    counts[h.title] = (counts[h.title] || 0) + 1;
    meta[h.title] = h;
  });
  legendEl.innerHTML = Object.keys(counts).map(title => `
    <span class="legend-chip">
      <span class="legend-swatch" style="background: ${meta[title].color}"></span>
      ${escapeHtml(title)}
      <span class="legend-count">${counts[title]}</span>
    </span>
  `).join('');
}

function renderHighlighted(transcript, highlights) {
  if (highlights.length === 0) {
    resultBoxEl.innerHTML = escapeHtml(transcript);
    return;
  }
  let html = '';
  let cursor = 0;
  highlights.forEach((h, idx) => {
    if (h.start < cursor) return; // защита от пересечений
    html += escapeHtml(transcript.slice(cursor, h.start));
    html += `<mark class="pattern-hit" data-idx="${idx}" style="background: ${h.color}">${escapeHtml(transcript.slice(h.start, h.end))}</mark>`;
    cursor = h.end;
  });
  html += escapeHtml(transcript.slice(cursor));
  resultBoxEl.innerHTML = html;
}

resultBoxEl.addEventListener('click', (e) => {
  const mark = e.target.closest('mark.pattern-hit');
  if (!mark) {
    hitPopover.classList.remove('visible');
    return;
  }
  const h = state.highlights[Number(mark.dataset.idx)];
  if (!h) return;

  hitPopover.innerHTML = `
    <div class="hp-title" style="color: ${h.color}">${escapeHtml(h.title)}</div>
    <div class="hp-quote">«${escapeHtml(h.quote)}»</div>
    <div>${escapeHtml(h.explanation)}</div>
  `;
  const rect = mark.getBoundingClientRect();
  const top = Math.min(rect.bottom + 8, window.innerHeight - 160);
  const left = Math.min(rect.left, window.innerWidth - 340);
  hitPopover.style.top = `${top}px`;
  hitPopover.style.left = `${Math.max(8, left)}px`;
  hitPopover.classList.add('visible');
  e.stopPropagation();
});

document.addEventListener('click', () => hitPopover.classList.remove('visible'));

// --- Экспорт в .doc (Word-совместимый HTML-документ, открывается Word/LibreOffice) ---
exportBtn.addEventListener('click', () => {
  if (!state.transcript) return;

  let bodyHtml = '';
  let cursor = 0;
  state.highlights.forEach((h) => {
    if (h.start < cursor) return;
    bodyHtml += escapeHtml(state.transcript.slice(cursor, h.start)).replace(/\n/g, '<br>');
    bodyHtml += `<span style="background:${h.color}; font-weight:600;">${escapeHtml(state.transcript.slice(h.start, h.end))}</span>`;
    cursor = h.end;
  });
  bodyHtml += escapeHtml(state.transcript.slice(cursor)).replace(/\n/g, '<br>');

  const legendHtml = Object.entries(
    state.highlights.reduce((acc, h) => {
      acc[h.title] = { title: h.title, color: h.color };
      return acc;
    }, {})
  ).map(([, v]) => `<li><span style="background:${v.color}; padding:1px 8px; border-radius:4px;">&nbsp;</span> ${escapeHtml(v.title)}</li>`).join('');

  const stagesHtml = state.stageResults.map(stage => {
    const rows = stage.criteria.map(c => `
      <li>${c.verdict ? '✅' : '❌'} ${escapeHtml(c.criterion_text)}${c.explanation ? ` — <i>${escapeHtml(c.explanation)}</i>` : ''}</li>
    `).join('');
    return `<h3 style="font-size:13.5px; margin-bottom:4px;">${stage.passed ? '✅' : '❌'} ${escapeHtml(stage.stage_title)}</h3><ul>${rows}</ul>`;
  }).join('');

  const doc = `<!doctype html><html><head><meta charset="utf-8"><title>Анализ транскрибации — Pattern Lens</title></head>
<body style="font-family: Calibri, Arial, sans-serif; font-size: 14px; line-height: 1.6; color: #1a1a1a; max-width: 900px; margin: 0 auto; padding: 24px;">
  <h1 style="font-size: 20px;">Анализ транскрибации</h1>
  <h2 style="font-size: 15px; color: #24b48d;">Итоговое заключение</h2>
  <p>${escapeHtml(state.summary)}</p>
  <h2 style="font-size: 15px; color: #24b48d;">Этапы супервизии</h2>
  ${stagesHtml}
  <h2 style="font-size: 15px; color: #24b48d;">Найденные подсветки в тексте</h2>
  <ul>${legendHtml || '<li>Совпадений не найдено</li>'}</ul>
  <h2 style="font-size: 15px; color: #24b48d;">Транскрибация с подсветкой</h2>
  <p>${bodyHtml}</p>
</body></html>`;

  const blob = new Blob(['﻿', doc], { type: 'application/msword' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `pattern-lens-анализ-${new Date().toISOString().slice(0, 10)}.doc`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Документ сохранён');
});

(async () => {
  await loadStages();
  restoreLastRun();
})();
loadLlmProviders();
</script>
